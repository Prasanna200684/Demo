{% extends 'base.html' %}

{% block title %}404 Not Found — TrustVault{% endblock %}

{% block content %}
<main class="container" style="display: flex; align-items: center; justify-content: center; min-height: 70vh; text-align: center;">
  <div class="card" style="max-width: 500px; padding: 3rem 2rem;">
    <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔍</div>
    <div class="badge badge-viewer" style="margin-bottom: 1rem; font-size: 0.8rem;">404 NOT FOUND</div>
    <h1 style="font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 0.75rem;">Document or Route Not Found</h1>
    <p style="color: var(--text-secondary); font-size: 0.92rem; line-height: 1.6; margin-bottom: 2rem;">
      The requested vault record or route does not exist or may have been securely purged.
    </p>
    <a href="{{ url_for('my_documents') }}" class="btn btn-primary">
      Return to My Documents
    </a>
  </div>
</main>
{% endblock %}
