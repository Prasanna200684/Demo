{% extends 'base.html' %}

{% block title %}Sign In — TrustVault{% endblock %}

{% block content %}
<main class="container" style="display: flex; align-items: center; justify-content: center; min-height: 75vh;">
  <div class="card" style="width: 100%; max-width: 440px; padding: 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 44px; height: 44px; font-size: 1.3rem;">🛡️</div>
      <h1 style="font-size: 1.5rem; font-weight: 800; color: #fff;">Sign In to TrustVault</h1>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Enter your credentials to access confidential assets</p>
    </div>

    <!-- Quick Demo Logins -->
    <div style="background: var(--bg-deep); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 0.75rem; margin-bottom: 1.5rem;">
      <div style="font-size: 0.75rem; font-weight: 700; color: var(--emerald-400); margin-bottom: 0.5rem; text-transform: uppercase;">
        ⚡ Demo Quick Fill
      </div>
      <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('admin', 'admin123')">Admin</button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('owner_sarah', 'owner123')">Owner</button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('viewer_alex', 'viewer123')">Viewer</button>
      </div>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="login_input" class="form-label">Username or Email</label>
        <input type="text" id="login_input" name="login_input" class="form-control" placeholder="e.g. admin or your email" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
        Sign In ➔
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.88rem; color: var(--text-secondary);">
      New to TrustVault? 
      <a href="{{ url_for('register') }}" style="font-weight: 600; color: var(--emerald-400); margin-left: 0.25rem;">Create Account</a>
    </div>
  </div>
</main>
{% endblock %}

{% block extra_scripts %}
<script>
function quickFill(user, pass) {
  document.getElementById('login_input').value = user;
  document.getElementById('password').value = pass;
}
</script>
{% endblock %}
